plugins {
    id "net.neoforged.gradle.userdev" version "${neogradle_version}"
    id "multiversion-common-conventions"
    id "multiloader-common-conventions"
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

if (minecraft_version == "1.20.4") {
    processResources.filesMatching("META-INF/neoforge.mods.toml") {
        path = "META-INF/mods.toml"
    }
}

expandProps.put("neoforge_version_range", neoforge_version_range)