pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven { url = "https://maven.neoforged.net/releases" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "buttonfix"
include "fabric:1.19.4-1.21.11", "fabric:26.1-26.2"
include "forge:1.19.4-1.20.4", "forge:1.20.6-1.21.5", "forge:1.21.6-26.2"
include "neoforge:1.20.1", "neoforge:1.20.2-1.20.3", "neoforge:1.20.4-26.2"