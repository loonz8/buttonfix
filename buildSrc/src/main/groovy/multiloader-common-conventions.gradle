plugins {
    id "java"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

ext.expandProps = [
        "mod_id"                 : mod_id,
        "mod_icon"               : "pack.png",
        "mod_name"               : mod_name,
        "mod_version"            : mod_version,
        "mod_author"             : mod_author,
        "mod_license"            : mod_license,
        "mod_description"        : mod_description,
        "minecraft_version_range": minecraft_version_range
]
processResources {
    inputs.properties(expandProps)
    filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml", "META-INF/mods.toml", "pack.mcmeta"]) {
        expand expandProps
    }
    from(rootProject.file("assets/icon.png")) {
        rename { "pack.png" }
    }
}

jar {
    archiveBaseName = "${mod_id}-${mod_version}-${parent.project.name}+${minecraft_version_label}"
    from(rootProject.file("assets/LICENSE"))
    manifest {
        attributes([
                "Specification-Title"   : mod_name,
                "Specification-Vendor"  : mod_author,
                "Specification-Version" : mod_version,
                "Implementation-Title"  : parent.project.name,
                "Implementation-Version": mod_version,
                "Implementation-Vendor" : mod_author,
                "Built-On-Minecraft"    : minecraft_version
        ])
    }
}